[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cupdate"
version = "2.0.3"
description = "python updater"
keywords = ["python", "updater", "requirements"]
readme = "README.md"
license-files = ["LICENSE.md"]
authors = [{ name = "seydx", email = "hi@seydx.dev" }]
maintainers = [{ name = "seydx", email = "hi@seydx.dev" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["typing_extensions>=4.15.0", "requests>=2.32.5", "tabulate>=0.9.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cupdate = "cupdate.main:cli_main"

[project.urls]
Homepage = "https://github.com/seydx/cupdate"
Documentation = "https://github.com/seydx/cupdate"
Repository = "https://github.com/seydx/cupdate"
"Bug Tracker" = "https://github.com/seydx/cupdate/issues"
Changelog = "https://github.com/seydx/cupdate/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cupdate*"]

[tool.setuptools.package-data]
cupdate = ["py.typed"]
